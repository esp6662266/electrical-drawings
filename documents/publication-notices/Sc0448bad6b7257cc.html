<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공개 열람 범위</title><link rel="stylesheet" href="../manual-batch.css"></head><body><header><h1>접근정보 원본 공개 제외</h1></header><main><h2>A1180143_200_EN.pdf</h2><p>접근정보가 포함된 원본 파일은 공개하지 않습니다. 원본은 로컬에 보존했으며 해시는 원본 추적용입니다. 공개 열람본은 민감 본문·화면을 제외했습니다.</p><p><a href="/documents/equipment-14/library.html?source=Sc0448bad6b7257cc">공개 열람본 보기</a></p><code>원본 SHA-256 c0448bad6b7257ccce183d24e1373cd49fd509493129d047d0ebeb60bab5da6e</code></main></body></html>
